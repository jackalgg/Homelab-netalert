---
- name: Basic Pi setup check
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure nmap is installed
      ansible.builtin.apt:
        name: nmap
        state: present

    - name: Create a test file to prove the run worked
      ansible.builtin.copy:
        content: "AWX successfully ran this playbook on {{ ansible_date_time.iso8601 }}\n"
        dest: /tmp/awx_test.txt